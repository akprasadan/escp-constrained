[project]
name = "escp-constrained"
maintainers = [
  {name = "Akshay Prasadan", email = "akprasadan@gmail.com"}]
version = "0.0.0"
description = "Implement examples for constrained SCP operator"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "coverage>=7.13.5",
    "matplotlib>=3.10.8",
    "numba>=0.65.0",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pot>=0.9.6.post1",
    "pytest>=9.0.3",
    "scipy>=1.17.1",
    "snakeviz>=2.2.2",
]

[project.urls]
Repository = "https://github.com/akprasadan/escp-constrained.git"

[build-system]
requires = ["uv_build>=0.11.1,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "src"
