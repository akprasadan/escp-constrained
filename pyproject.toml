[project]
name = "escp-constrained"
maintainers = [
  {name = "Akshay Prasadan", email = "akprasadan@gmail.com"}]
version = "0.0.0"
description = "Implement examples for constrained SCP operator"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pytest>=9.0.2",
]

[project.urls]
Repository = "https://github.com/akprasadan/escp-constrained.git"

[build-system]
requires = ["uv_build>=0.11.1,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "src"
